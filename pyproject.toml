[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kubecontext"
version = "0.1.0"
description = "Kubeconfig manager with SSH import and context management"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "paramiko>=5.1.0",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
kubecontext = "kubecontext.main:main"

[tool.hatch.build.targets.wheel]
packages = ["kubecontext"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
